name: Build Xash3D FWGS (arm64-v8a) + CS16Client (Android)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  CLIENT_REPO: ${{ github.repository }}
  CLIENT_REF: ${{ github.ref_name }}
  
  ENGINE_REPO: VILDANxTIGR/xash3d-fwgs
  ENGINE_REF: master

  SDL_VERSION: 2.32.10
  FFMPEG_VERSION: '9.0'
  GH_CPU_OS: android
  GH_CPU_ARCH: multiarch

  NDK_28: 28.2.13676358
  NDK_29: 29.0.14206865
  CMAKE_VERSION: 3.22.1

jobs:
  build:
    name: Build engine + client
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: engine
          submodules: false

      - name: Checkout client
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CLIENT_REPO }}
          ref: ${{ env.CLIENT_REF }}
          path: client
          submodules: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CMake, Ninja and ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_28}" \
            "ndk;${NDK_29}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_28}" >> "$GITHUB_ENV"

      - name: Init submodules
        shell: bash
        run: |
          set -euo pipefail
          init_submodules() {
            local dir="$1"
            pushd "$dir" > /dev/null
            if git ls-files --stage | grep -q '^160000'; then
              git submodule sync --recursive
              git submodule update --init --recursive
            else
              git config -f .gitmodules --get-regexp '^submodule\..*\.path$' |
              while read -r key path; do
                name="${key#submodule.}"; name="${name%.path}"
                url="$(git config -f .gitmodules --get "submodule.${name}.url")"
                upd="$(git config -f .gitmodules --get "submodule.${name}.update" || true)"
                [ "$upd" = "none" ] && continue
                rm -rf "$path"
                git clone --recursive "$url" "$path"
              done
            fi
            popd > /dev/null
          }
          init_submodules engine
          init_submodules client
          if ! (cd engine && git ls-files --stage | grep -q '^160000'); then
            git clone https://github.com/FWGS/nanogl engine/3rdparty/nanogl
            git clone https://github.com/ptitSeb/gl4es engine/3rdparty/gl4es/gl4es
            sed -i '/git submodule update --init --checkout 3rdparty\/nanogl/d' engine/scripts/gha/deps_android.sh
          fi

      - name: Patch Engine (Wallhack + Fixed No Recoil)
        shell: python
        run: |
          import os
          import sys

          def replace_once(path, old, new, desc):
              if not os.path.exists(path):
                  sys.exit(f"ERROR: File not found: {path}")

              with open(path, "r") as f:
                  content = f.read()

              count = content.count(old)
              if count != 1:
                  sys.exit(f"ERROR: {desc}: expected 1 match, found {count}")

              content = content.replace(old, new, 1)

              with open(path, "w") as f:
                  f.write(content)

              print(f"Patched: {desc}")

          renderer_path = "engine/ref/gl/gl_rmain.c"
          old_renderer = "R_DrawStudioModel( RI.currententity );"
          new_renderer = """if ( RI.currententity->player && gEngfuncs.pfnGetCvarPointer( "esp_enabled" ) && gEngfuncs.pfnGetCvarPointer( "esp_enabled" )->value > 0.5f )
          {
              pglDepthRange( 0.0f, 0.01f );
              R_DrawStudioModel( RI.currententity );
              pglDepthRange( gldepthmin, gldepthmax );
          }
          else
          {
              R_DrawStudioModel( RI.currententity );
          }"""

          if not os.path.exists(renderer_path):
              sys.exit("ERROR: Renderer file not found")

          with open(renderer_path, "r") as f:
              content = f.read()

          count = content.count(old_renderer)
          if count == 0:
              sys.exit("ERROR: R_DrawStudioModel not found")

          content = content.replace(old_renderer, new_renderer)

          with open(renderer_path, "w") as f:
              f.write(content)

          print(f"Renderer patched: {count} occurrences")

          # ИСПРАВЛЕНЫ ПУТИ (добавлена папка engine/)
          main_file = "engine/engine/client/cl_main.c"
          replace_once(
              main_file,
              '#include "multi_emulator.h"',
              '#include "multi_emulator.h"\nCVAR_DEFINE_AUTO( esp_enabled, "0", FCVAR_ARCHIVE, "Enable ESP" );\nCVAR_DEFINE_AUTO( norecoil, "0", FCVAR_ARCHIVE, "No Recoil" );',
              "CVAR definitions"
          )

          # ИСПРАВЛЕНЫ ПУТИ (добавлена папка engine/)
          view_file = "engine/engine/client/cl_view.c"
          replace_once(
              view_file,
              "VectorCopy( cl.punchangle, fd->punchangle );",
              '''if( Cvar_VariableValue( "norecoil" ) > 0.5f )
              VectorClear( cl.punchangle );
          VectorCopy( cl.punchangle, fd->punchangle );''',
              "No Recoil"
          )

          # ИСПРАВЛЕНЫ ПУТИ (добавлена папка engine/)
          frame_file = "engine/engine/client/cl_frame.c"
          replace_once(
              frame_file,
              "ent->curstate.rendermode = kRenderTransAdd;",
              "ent->curstate.rendermode = kRenderTransColor; ent->curstate.rendercolor.r = 255; ent->curstate.rendercolor.g = 0; ent->curstate.rendercolor.b = 0; ent->curstate.renderamt = 255;",
              "ESP render mode"
          )

      - name: Patch Client (Aimbot + Bunnyhop)
        shell: python
        run: |
          import os
          import sys

          input_file = 'client/cl_dll/input/input_xash3d.cpp'
          if os.path.exists(input_file):
              with open(input_file, 'r') as f:
                  content = f.read()

              def replace_once(source, old, new, desc):
                  count = source.count(old)
                  if count != 1:
                      sys.exit(f'ERROR: {desc}: expected 1 match, found {count}')
                  return source.replace(old, new, 1)

              content = replace_once(content, 'bool g_bAimbotEnabled = false;', 'bool g_bAimbotEnabled = false;\nbool g_bBhopEnabled = false;', 'Bhop global var')
              content = replace_once(content, 'void ToggleAimbot( void )', 'void ToggleBhop( void )\n{\n    g_bBhopEnabled = !g_bBhopEnabled;\n}\n\nvoid ToggleAimbot( void )', 'ToggleBhop func')
              content = replace_once(content, 'gEngfuncs.pfnAddCommand( "toggle_aim", ToggleAimbot );', 'gEngfuncs.pfnAddCommand( "toggle_aim", ToggleAimbot );\n\tgEngfuncs.pfnAddCommand( "toggle_bhop", ToggleBhop );', 'Bhop command')

              old_func = 'void IN_Move( float frametime, usercmd_t *cmd )\n{'
              new_func = 'void IN_Move( float frametime, usercmd_t *cmd )\n{\n    cl_entity_t *local = gEngfuncs.GetLocalPlayer();\n\n    if ( local && g_bBhopEnabled && ( cmd->buttons & IN_JUMP ) )\n    {\n        if ( local->curstate.onground != -1 )\n        {\n            cmd->buttons |= IN_JUMP;\n        }\n    }\n'
              content = replace_once(content, old_func, new_func, 'IN_Move start')

              with open(input_file, 'w') as f:
                  f.write(content)
              print('Client patch applied and all anchors verified.')

      - name: Fix MenuFactory Crash (sed)
        run: |
          # ИСПРАВЛЕН ПУТЬ
          sed -i 's/gEngfuncs.Host_Error( "MenuFactory is unavailable.*/gEngfuncs.Con_Printf( "MenuFactory is unavailable\\n" );/' client/cl_dll/cdll_int.cpp || true
          sed -i 's/Host_Error( "MenuFactory is unavailable.*/Con_Printf( "MenuFactory is unavailable\\n" );/' client/cl_dll/cdll_int.cpp || true
          echo "Checked and patched cdll_int.cpp for MenuFactory."

      - name: Disable local server
        run: |
          # ИСПРАВЛЕН ПУТЬ
          sed -i 's/option(BUILD_SERVER "Build server library." ON)/option(BUILD_SERVER "Build server library." OFF)/' client/CMakeLists.txt || true

      - name: Fetch YaPB history
        run: git -C client/3rdparty/yapb fetch --unshallow origin || true

      - name: Engine - dependencies
        working-directory: engine
        run: GITHUB_WORKSPACE="$PWD" bash scripts/gha/deps_android.sh

      - name: Engine - restrict ABI
        working-directory: engine
        run: |
          F=android/app/build.gradle.kts
          sed -i 's/setOf("armeabi-v7a", "arm64-v8a", "x86")/setOf("arm64-v8a")/' "$F"

      - name: Engine - build
        working-directory: engine
        run: GITHUB_WORKSPACE="$PWD" bash scripts/gha/build_android.sh

      - name: Client - build (Clean ID)
        working-directory: client/android
        run: |
          sed -i 's/applicationIdSuffix[[:space:]]*[=]*[[:space:]]*["'\'']\?\.test["'\'']\?//g' app/build.gradle || true
          sed -i 's/applicationIdSuffix[[:space:]]*[=]*[[:space:]]*["'\'']\?\.test["'\'']\?//g' app/build.gradle.kts || true
          
          chmod +x gradlew
          ./gradlew clean assembleGitDebug -Pandroid.injected.build.abi=arm64-v8a --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Final-APKs
          path: |
            engine/artifacts/*.apk
            client/android/app/build/outputs/apk/git/debug/*.apk
          if-no-files-found: error
