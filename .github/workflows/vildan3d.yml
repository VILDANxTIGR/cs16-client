name: Build Xash3D FWGS (arm64-v8a) + CS16Client (Android)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  CLIENT_REPO: ${{ github.repository }}
  CLIENT_REF: ${{ github.ref_name }}
  
  ENGINE_REPO: VILDANxTIGR/xash3d-fwgs
  ENGINE_REF: master

  SDL_VERSION: 2.32.10
  FFMPEG_VERSION: '9.0'
  GH_CPU_OS: android
  GH_CPU_ARCH: multiarch

  NDK_28: 28.2.13676358
  NDK_29: 29.0.14206865
  CMAKE_VERSION: 3.22.1

jobs:
  build:
    name: Build engine + client
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: engine
          submodules: false

      - name: Checkout client
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CLIENT_REPO }}
          ref: ${{ env.CLIENT_REF }}
          path: client
          submodules: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CMake, Ninja and ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_28}" \
            "ndk;${NDK_29}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_28}" >> "$GITHUB_ENV"

      - name: Init submodules
        shell: bash
        run: |
          set -euo pipefail
          init_submodules() {
            local dir="$1"
            pushd "$dir" > /dev/null
            if git ls-files --stage | grep -q '^160000'; then
              git submodule sync --recursive
              git submodule update --init --recursive
            else
              git config -f .gitmodules --get-regexp '^submodule\..*\.path$' |
              while read -r key path; do
                name="${key#submodule.}"; name="${name%.path}"
                url="$(git config -f .gitmodules --get "submodule.${name}.url")"
                upd="$(git config -f .gitmodules --get "submodule.${name}.update" || true)"
                [ "$upd" = "none" ] && continue
                rm -rf "$path"
                git clone --recursive "$url" "$path"
              done
            fi
            popd > /dev/null
          }
          init_submodules engine
          init_submodules client
          if ! (cd engine && git ls-files --stage | grep -q '^160000'); then
            git clone https://github.com/FWGS/nanogl engine/3rdparty/nanogl
            git clone https://github.com/ptitSeb/gl4es engine/3rdparty/gl4es/gl4es
            sed -i '/git submodule update --init --checkout 3rdparty\/nanogl/d' engine/scripts/gha/deps_android.sh
          fi

      - name: Disable optional MenuFactory
        shell: python
        run: |
          import pathlib
          import sys

          path = pathlib.Path("client/cl_dll/cdll_int.cpp")
          content = path.read_text(encoding="utf-8")

          old = 'static void LoadMenuInterface( void )\n{\n\tif( g_pMenu )\n\t\treturn;\n\n\tg_pMenu = GetNativeMenuExports();\n\tif( !g_pMenu )\n\t\tHUD_MessageBox( "Error: native object \\"MenuFactory\\" is unavailable\\n" );\n}'

          new = 'static void LoadMenuInterface( void )\n{\n\tg_pMenu = nullptr;\n}'

          count = content.count(old)
          if count != 1:
              sys.exit(f"MenuFactory patch: expected 1 match, found {count}")

          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          print("MenuFactory loading disabled.")

      - name: Patch Engine (Wallhack + No Recoil + Net Buffer)
        shell: python
        run: |
          import os
          import sys

          def replace_once(path, old, new, desc):
              if not os.path.exists(path):
                  sys.exit(f"ERROR: File not found: {path}")

              with open(path, "r") as f:
                  content = f.read()

              count = content.count(old)
              if count != 1:
                  sys.exit(f"ERROR: {desc}: expected 1 match, found {count}")

              content = content.replace(old, new, 1)

              with open(path, "w") as f:
                  f.write(content)

              print(f"Patched: {desc}")

          # 1. Wallhack
          renderer_path = "engine/ref/gl/gl_rmain.c"
          old_renderer = "R_DrawStudioModel( RI.currententity );"
          new_renderer = (
              'if ( RI.currententity->player && gEngfuncs.pfnGetCvarPointer( "esp_enabled" ) && gEngfuncs.pfnGetCvarPointer( "esp_enabled" )->value > 0.5f )\n'
              '{\n'
              '    GLboolean old_depth = pglIsEnabled( GL_DEPTH_TEST );\n'
              '    pglDisable( GL_DEPTH_TEST );\n'
              '    R_DrawStudioModel( RI.currententity );\n'
              '    if( old_depth ) pglEnable( GL_DEPTH_TEST );\n'
              '    else pglDisable( GL_DEPTH_TEST );\n'
              '}\n'
              'else\n'
              '{\n'
              '    R_DrawStudioModel( RI.currententity );\n'
              '}'
          )
          
          if not os.path.exists(renderer_path):
              sys.exit("ERROR: Renderer file not found")

          with open(renderer_path, "r") as f:
              content = f.read()

          count = content.count(old_renderer)
          if count != 2:
              sys.exit(f"ERROR: Expected 2 renderer anchors, found {count}")

          content = content.replace(old_renderer, new_renderer)

          with open(renderer_path, "w") as f:
              f.write(content)

          print(f"Renderer patched for True Wallhack: {count} occurrences")

          # 2. CVAR definitions
          main_file = "engine/engine/client/cl_main.c"
          replace_once(
              main_file,
              '#include "multi_emulator.h"',
              '#include "multi_emulator.h"\nCVAR_DEFINE_AUTO( esp_enabled, "0", FCVAR_ARCHIVE, "Enable ESP" );\nCVAR_DEFINE_AUTO( norecoil, "0", FCVAR_ARCHIVE, "No Recoil" );',
              "CVAR definitions"
          )

          # 3. No Recoil (engine) - soft
          view_file = "engine/engine/client/cl_view.c"
          if os.path.exists(view_file):
              with open(view_file, "r") as f:
                  content = f.read()
              old_nr = "VectorCopy( cl.punchangle, fd->punchangle );"
              new_nr = 'if( Cvar_VariableValue( "norecoil" ) > 0.5f )\n\t\tVectorClear( cl.punchangle );\n\tVectorCopy( cl.punchangle, fd->punchangle );'
              if old_nr in content:
                  content = content.replace(old_nr, new_nr, 1)
                  print("Patched cl_view.c for No Recoil")
              else:
                  print("WARNING: Could not find punchangle in cl_view.c")
              with open(view_file, "w") as f:
                  f.write(content)

          # 4. ESP color
          frame_file = "engine/engine/client/cl_frame.c"
          replace_once(
              frame_file,
              "ent->curstate.rendermode = kRenderTransAdd;",
              "ent->curstate.rendermode = kRenderTransColor; ent->curstate.rendercolor.r = 255; ent->curstate.rendercolor.g = 0; ent->curstate.rendercolor.b = 0; ent->curstate.renderamt = 255;",
              "ESP render mode"
          )

          # 5. Net buffer (soft)
          net_chan_file = "engine/common/net_chan.h"
          if os.path.exists(net_chan_file):
              with open(net_chan_file, "r") as f:
                  content = f.read()
              patched = False
              for old_val in ["16384", "0x4000", "32768", "0x8000"]:
                  old_str = f"#define NET_MAX_MESSAGE {old_val}"
                  if old_str in content:
                      content = content.replace(old_str, "#define NET_MAX_MESSAGE 65536", 1)
                      print(f"Patched NET_MAX_MESSAGE from {old_val} to 65536")
                      patched = True
                      break
              if not patched:
                  print("WARNING: Could not find NET_MAX_MESSAGE definition")
              with open(net_chan_file, "w") as f:
                  f.write(content)
          else:
              print("WARNING: net_chan.h not found")

      - name: Patch Client (Aimbot + Bhop + No Recoil + FOV)
        shell: python
        run: |
          import os
          import sys

          def replace_once(path, old, new, desc):
              if not os.path.exists(path):
                  sys.exit(f"ERROR: File not found: {path}")

              with open(path, "r") as f:
                  content = f.read()

              count = content.count(old)
              if count != 1:
                  sys.exit(f"ERROR: {desc}: expected 1 match, found {count}")

              content = content.replace(old, new, 1)

              with open(path, "w") as f:
                  f.write(content)

              print(f"Patched: {desc}")

          input_file = 'client/cl_dll/input/input_xash3d.cpp'
          replace_once(
              input_file,
              'bool g_bAimbotEnabled = false;',
              'bool g_bAimbotEnabled = false;\nbool g_bBhopEnabled = false;',
              'Global Vars'
          )
          replace_once(
              input_file,
              'void ToggleAimbot( void )',
              'void ToggleBhop( void )\n{\n    g_bBhopEnabled = !g_bBhopEnabled;\n}\n\nvoid ToggleAimbot( void )',
              'ToggleBhop func'
          )
          replace_once(
              input_file,
              'gEngfuncs.pfnAddCommand( "toggle_aim", ToggleAimbot );',
              'gEngfuncs.pfnAddCommand( "toggle_aim", ToggleAimbot );\n\tgEngfuncs.pfnAddCommand( "toggle_bhop", ToggleBhop );',
              'Bhop command'
          )

          old_in_move = 'void IN_Move( float frametime, usercmd_t *cmd )\n{'

          new_in_move = (
              "void IN_Move( float frametime, usercmd_t *cmd )\n"
              "{\n"
              "    cl_entity_t *local = gEngfuncs.GetLocalPlayer();\n"
              "\n"
              "    if ( local && g_bBhopEnabled && ( cmd->buttons & IN_JUMP ) )\n"
              "    {\n"
              "        if ( local->curstate.onground != -1 )\n"
              "        {\n"
              "            cmd->buttons |= IN_JUMP;\n"
              "        }\n"
              "        else\n"
              "        {\n"
              "            cmd->buttons &= ~IN_JUMP;\n"
              "        }\n"
              "    }\n"
              "\n"
              "    if ( g_bAimbotEnabled && local && ( cmd->buttons & IN_ATTACK ) )\n"
              "    {\n"
              "        cl_entity_t *best_target = NULL;\n"
              "        float best_dist = 99999.0f;\n"
              "        vec3_t delta;\n"
              "        float fov = 90.0f;\n"
              "\n"
              "        for ( int i = 1; i <= 32; i++ )\n"
              "        {\n"
              "            cl_entity_t *ent = gEngfuncs.GetEntityByIndex(i);\n"
              "            if ( ent && ent->player && ent->curstate.health > 0 && ent->index != local->index )\n"
              "            {\n"
              "                delta[0] = ent->origin[0] - local->origin[0];\n"
              "                delta[1] = ent->origin[1] - local->origin[1];\n"
              "                delta[2] = ent->origin[2] - local->origin[2];\n"
              "                float dist = sqrt(delta[0]*delta[0] + delta[1]*delta[1] + delta[2]*delta[2]);\n"
              "                if ( dist < best_dist && dist < 2000.0f )\n"
              "                {\n"
              "                    float hyp = sqrt(delta[0]*delta[0] + delta[1]*delta[1]);\n"
              "                    float target_pitch = atan2(delta[2], hyp) * 180.0f / M_PI;\n"
              "                    float target_yaw = atan2(delta[1], delta[0]) * 180.0f / M_PI;\n"
              "                    \n"
              "                    float pitch_diff = fabs( target_pitch - cmd->viewangles[0] );\n"
              "                    float yaw_diff = fabs( target_yaw - cmd->viewangles[1] );\n"
              "                    \n"
              "                    if ( pitch_diff < fov && yaw_diff < fov )\n"
              "                    {\n"
              "                        best_dist = dist;\n"
              "                        best_target = ent;\n"
              "                    }\n"
              "                }\n"
              "            }\n"
              "        }\n"
              "        if ( best_target )\n"
              "        {\n"
              "            delta[0] = best_target->origin[0] - local->origin[0];\n"
              "            delta[1] = best_target->origin[1] - local->origin[1];\n"
              "            delta[2] = best_target->origin[2] - local->origin[2];\n"
              "            float hyp = sqrt(delta[0]*delta[0] + delta[1]*delta[1]);\n"
              "            cmd->viewangles[0] = atan2(delta[2], hyp) * 180.0f / M_PI;\n"
              "            cmd->viewangles[1] = atan2(delta[1], delta[0]) * 180.0f / M_PI;\n"
              "        }\n"
              "    }\n"
          )
          replace_once(input_file, old_in_move, new_in_move, 'IN_Move start')

          # No Recoil (client) - soft
          view_cpp = 'client/cl_dll/view.cpp'
          if os.path.exists(view_cpp):
              with open(view_cpp, "r") as f:
                  content = f.read()
              old_punch = 'pparams->viewangles = pparams->cl_viewangles + pparams->punchangle + ev_punchangle;'
              new_punch = 'pparams->viewangles = pparams->cl_viewangles + ev_punchangle;'
              if old_punch in content:
                  content = content.replace(old_punch, new_punch, 1)
                  print("Patched view.cpp for No Recoil (client)")
              else:
                  print("WARNING: Could not find punchangle line in view.cpp")
              with open(view_cpp, "w") as f:
                  f.write(content)

          # FOV Circle in hud.cpp - soft
          hud_file = 'client/cl_dll/hud.cpp'
          if os.path.exists(hud_file):
              with open(hud_file, "r") as f:
                  content = f.read()

              draw_funcs = (
                  "\n"
                  "#include <math.h>\n"
                  "#include <stdlib.h>\n"
                  "#ifndef M_PI\n"
                  "#define M_PI 3.14159265358979323846\n"
                  "#endif\n"
                  "\n"
                  "extern bool g_bAimbotEnabled;\n"
                  "\n"
                  "static void DrawDebugCircle(int cx, int cy, int radius, int segments, int r, int g, int b, int a)\n"
                  "{\n"
                  "    if (radius <= 0 || segments < 3) return;\n"
                  "    float previousX = cx + radius;\n"
                  "    float previousY = cy;\n"
                  "    for (int i = 1; i <= segments; i++)\n"
                  "    {\n"
                  "        float angle = (float)i * 2.0f * (float)M_PI / segments;\n"
                  "        float currentX = cx + cosf(angle) * radius;\n"
                  "        float currentY = cy + sinf(angle) * radius;\n"
                  "        int x1 = (int)previousX;\n"
                  "        int y1 = (int)previousY;\n"
                  "        int x2 = (int)currentX;\n"
                  "        int y2 = (int)currentY;\n"
                  "        int dx = abs(x2 - x1);\n"
                  "        int dy = abs(y2 - y1);\n"
                  "        int sx = x1 < x2 ? 1 : -1;\n"
                  "        int sy = y1 < y2 ? 1 : -1;\n"
                  "        int error = dx - dy;\n"
                  "        while (true)\n"
                  "        {\n"
                  "            FillRGBA(x1, y1, 2, 2, r, g, b, a);\n"
                  "            if (x1 == x2 && y1 == y2) break;\n"
                  "            int e2 = 2 * error;\n"
                  "            if (e2 > -dy) { error -= dy; x1 += sx; }\n"
                  "            if (e2 < dx) { error += dx; y1 += sy; }\n"
                  "        }\n"
                  "        previousX = currentX;\n"
                  "        previousY = currentY;\n"
                  "    }\n"
                  "}\n"
                  "\n"
                  "static void DrawCameraFOVDebug()\n"
                  "{\n"
                  "    const float debugFOV = 90.0f;\n"
                  "    float cameraFOV = (float)gHUD.m_iFOV;\n"
                  "    if (cameraFOV <= 0.0f) cameraFOV = 90.0f;\n"
                  "    const float halfScreen = ScreenWidth * 0.5f;\n"
                  "    float radius = halfScreen * tanf(debugFOV * (float)M_PI / 360.0f) / tanf(cameraFOV * (float)M_PI / 360.0f);\n"
                  "    int cx = ScreenWidth / 2;\n"
                  "    int cy = ScreenHeight / 2;\n"
                  "    DrawDebugCircle(cx, cy, (int)radius, 96, 0, 255, 0, 180);\n"
                  "}\n"
                  "\n"
              )

              search_str = 'void CHud::Redraw( float flTime, int intermission )'
              if search_str in content:
                  content = content.replace(search_str, draw_funcs + search_str, 1)
                  start_idx = content.find(search_str)
                  brace_idx = content.find('{', start_idx)
                  if brace_idx != -1:
                      inject = '\n\tif ( g_bAimbotEnabled ) DrawCameraFOVDebug();\n'
                      content = content[:brace_idx+1] + inject + content[brace_idx+1:]
                      print("Injected FOV circle into hud.cpp")
                  else:
                      print("WARNING: Could not find brace for CHud::Redraw")
              else:
                  print("WARNING: Could not find CHud::Redraw in hud.cpp")

              with open(hud_file, 'w') as f:
                  f.write(content)

      - name: Fix VectorSubtract and check
        shell: python
        run: |
          import pathlib
          import sys

          path = pathlib.Path("client/cl_dll/input/input_xash3d.cpp")

          if not path.exists():
              sys.exit("ERROR: input_xash3d.cpp not found")

          content = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "VectorSubtract( ent->origin, local->origin, delta );",
                  "delta[0] = ent->origin[0] - local->origin[0];\n"
                  "                delta[1] = ent->origin[1] - local->origin[1];\n"
                  "                delta[2] = ent->origin[2] - local->origin[2];"
              ),
              (
                  "VectorSubtract( best_target->origin, local->origin, delta );",
                  "delta[0] = best_target->origin[0] - local->origin[0];\n"
                  "                delta[1] = best_target->origin[1] - local->origin[1];\n"
                  "                delta[2] = best_target->origin[2] - local->origin[2];"
              )
          ]

          for old, new in replacements:
              count = content.count(old)
              if count != 1:
                  print(f"WARNING: Expected 1 occurrence, found {count}: {old}")
              else:
                  content = content.replace(old, new, 1)

          if "VectorSubtract(" in content:
              print("ERROR: Other VectorSubtract calls remain!")
              sys.exit(1)

          path.write_text(c
