name: VILDAN 3D Final
on: [workflow_dispatch, push]
env:
  ENGINE_REPO: VILDANxTIGR/xash3d-fwgs
  CLIENT_REPO: VILDANxTIGR/cs16-client
  NDK_VERSION: '28.2.13676358'
  FFMPEG_TAG: 'n6.0'
  IMGUI_TAG: 'v1.90.5'
  SDL_TAG: 'release-2.30.0'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { repository: '${{ env.ENGINE_REPO }}', ref: 707596f4905689ec224e993fcaa4d4ad66aa67d6, path: engine }
      - uses: actions/checkout@v4
        with: { repository: '${{ env.CLIENT_REPO }}', path: client }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - name: Deps / NDK
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build unzip curl xz-utils python3
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null
          NDK="$SDK/ndk/${NDK_VERSION}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Setup Dependencies & Copy to Engine
        run: |
          set -euo pipefail
          cd engine
          mkdir -p 3rdparty
          rm -rf 3rdparty/imgui 3rdparty/SDL 3rdparty/ffmpeg

          # Скачиваем зависимости
          git clone --depth 1 --branch "${IMGUI_TAG}" https://github.com/ocornut/imgui.git 3rdparty/imgui
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/sdl2.tar.gz "https://github.com/libsdl-org/SDL/archive/refs/tags/${SDL_TAG}.tar.gz"
          mkdir -p 3rdparty/SDL && tar -xzf /tmp/sdl2.tar.gz --strip-components=1 -C 3rdparty/SDL
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/ffmpeg.tar.gz "https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/refs/tags/${FFMPEG_TAG}"
          mkdir -p 3rdparty/ffmpeg && tar -xzf /tmp/ffmpeg.tar.gz --strip-components=1 -C 3rdparty/ffmpeg

          # Копируем ImGui ВНУТРЬ дерева ref/gl/imgui
          mkdir -p ref/gl/imgui/backends
          cp 3rdparty/imgui/imgui.cpp 3rdparty/imgui/imgui.h 3rdparty/imgui/imgui_internal.h 3rdparty/imgui/imconfig.h ref/gl/imgui/
          cp 3rdparty/imgui/imgui_draw.cpp 3rdparty/imgui/imgui_tables.cpp 3rdparty/imgui/imgui_widgets.cpp ref/gl/imgui/
          cp 3rdparty/imgui/imstb_rectpack.h 3rdparty/imgui/imstb_textedit.h 3rdparty/imgui/imstb_truetype.h ref/gl/imgui/
          cp 3rdparty/imgui/backends/imgui_impl_opengl3.cpp 3rdparty/imgui/backends/imgui_impl_opengl3.h ref/gl/imgui/backends/
          cp 3rdparty/imgui/backends/imgui_impl_opengl3_loader.h ref/gl/imgui/backends/

      - name: Generate UI Code & Patch
        shell: bash
        run: |
          python3 << 'PYEOF'
          import os, re
          from pathlib import Path

          # 1. Отключаем скачивание в deps_android.sh
          deps = Path("engine/scripts/gha/deps_android.sh")
          if deps.exists():
              out = []
              for line in deps.read_text().splitlines():
                  if re.search(r'(wget|curl)', line) and re.search(r'(SDL|ffmpeg|FFmpeg)', line, re.IGNORECASE):
                      out.append(": # [PATCHED] Skipped download: " + line.strip())
                  else:
                      out.append(line)
              deps.write_text("\n".join(out))
              os.system("bash -n engine/scripts/gha/deps_android.sh")

          # 2. Генерация vildan_menu.h и .cpp в ref/gl/
          header = '#pragma once\n#ifdef __cplusplus\nextern "C" {\n#endif\nvoid VILDAN_Init(void);\nvoid VILDAN_DrawMenu(void);\nvoid VILDAN_ProcessTouch(int, float, float, long long);\n#ifdef __cplusplus\n}\n#endif'
          Path("engine/ref/gl/vildan_menu.h").write_text(header)
          
          cpp = r'''#include "vildan_menu.h"
          #include "imgui/imgui.h"
          #include "imgui/backends/imgui_impl_opengl3.h"
          #include <GLES2/gl2.h>
          #include "ref_api.h"
          #include <SDL.h>
          static bool r = false, o = true;
          extern "C" void VILDAN_ProcessTouch(int a, float x, float y, long long f) {
              if(!r) return; auto& i = ImGui::GetIO();
              if(i.DisplaySize.x <= 0 || i.DisplaySize.y <= 0) return;
              float rx = x * i.DisplaySize.x, ry = y * i.DisplaySize.y;
              if(a == 1) { i.AddMouseSourceEvent(ImGuiMouseSource_TouchScreen); i.AddMousePosEvent(rx, ry); i.AddMouseButtonEvent(0, true); }
              else if(a == 2) { i.AddMousePosEvent(rx, ry); }
              else if(a == 3) { i.AddMousePosEvent(rx, ry); i.AddMouseButtonEvent(0, false); }
          }
          int VILDAN_EventWatch(void *u, SDL_Event *e) {
              if(e->type == SDL_FINGERDOWN || e->type == SDL_FINGERMOTION || e->type == SDL_FINGERUP) {
                  int a = e->type == SDL_FINGERDOWN ? 1 : (e->type == SDL_FINGERMOTION ? 2 : 3);
                  VILDAN_ProcessTouch(a, e->tfinger.x, e->tfinger.y, e->tfinger.fingerId);
              }
              return 0;
          }
          extern "C" void VILDAN_Init(void) {
              if(r) return; IMGUI_CHECKVERSION(); ImGui::CreateContext(); ImGui::StyleColorsDark();
              ImGui::GetIO().IniFilename = nullptr; ImGui::GetIO().Fonts->AddFontDefault();
              ImGui::GetStyle().ScaleAllSizes(1.7f);
              if(!ImGui_ImplOpenGL3_Init("#version 100")) return;
              SDL_AddEventWatch(VILDAN_EventWatch, NULL); r = true;
          }
          extern "C" void VILDAN_DrawMenu(void) {
              if(!r) return; GLint v[4]; glGetIntegerv(GL_VIEWPORT, v);
              if(v[2] <= 0 || v[3] <= 0) return; auto& i = ImGui::GetIO();
              i.DisplaySize = ImVec2(v[2], v[3]); i.DeltaTime = 1.0f/60.0f;
              ImGui_ImplOpenGL3_NewFrame(); ImGui::NewFrame();
              if(o) {
                  ImGui::SetNextWindowSize(ImVec2(800, 560), ImGuiCond_FirstUseEver);
                  ImGui::SetNextWindowPos(ImVec2(40, 40), ImGuiCond_FirstUseEver);
                  if(ImGui::Begin("VILDAN 3D - Mod Menu", &o)) {
                      ImGui::Text("Welcome!"); ImGui::Separator();
                      auto* c1 = gEngfuncs.pfnGetCvarPointer("vildan_esp"); bool b1 = c1 && c1->value > 0.5f;
                      if(ImGui::Checkbox("ESP", &b1)) { if(c1) c1->value = b1 ? 1.0f : 0.0f; }
                      auto* c2 = gEngfuncs.pfnGetCvarPointer("vildan_aimbot"); bool b2 = c2 && c2->value > 0.5f;
                      if(ImGui::Checkbox("Aimbot", &b2)) { if(c2) c2->value = b2 ? 1.0f : 0.0f; }
                      auto* c3 = gEngfuncs.pfnGetCvarPointer("vildan_bhop"); bool b3 = c3 && c3->value > 0.5f;
                      if(ImGui::Checkbox("Bhop", &b3)) { if(c3) c3->value = b3 ? 1.0f : 0.0f; }
                      if(ImGui::Button("Свернуть")) o = false;
                  } ImGui::End();
              }
              if(!o) {
                  ImGui::SetNextWindowPos(ImVec2(i.DisplaySize.x - 80, 10), ImGuiCond_Always);
                  ImGui::SetNextWindowSize(ImVec2(70, 70), ImGuiCond_Always);
                  if(ImGui::Begin("##V", nullptr, ImGuiWindowFlags_NoTitleBar | ImGuiWindowFlags_NoResize | ImGuiWindowFlags_NoMove | ImGuiWindowFlags_NoScrollbar)) {
                      if(ImGui::Button("V", ImVec2(60, 60))) o = true;
                  } ImGui::End();
              }
              ImGui::Render(); ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
          }'''
          Path("engine/ref/gl/vildan_menu.cpp").write_text(cpp)

          def patch_file(path, old, new):
              p = Path(path)
              if p.exists():
                  txt = p.read_text()
                  if old in txt:
                      p.write_text(txt.replace(old, new, 1))
                      print(f"Patched: {path}")

          # 3. Патчи C-файлов
          patch_file("engine/ref/gl/gl_opengl.c", "#include \"../ref_api.h\"", "#include \"../ref_api.h\"\n#include \"vildan_menu.h\"")
          patch_file("engine/ref/gl/gl_rmain.c", "#include \"../ref_api.h\"", "#include \"../ref_api.h\"\n#include \"vildan_menu.h\"")
          patch_file("engine/ref/gl/gl_opengl.c", "GL_OnContextCreated();", "GL_OnContextCreated();\n\tVILDAN_Init();")
          patch_file("engine/ref/gl/gl_rmain.c", "R_DrawStudioModel( RI.currententity );", 'if(RI.currententity->player && gEngfuncs.pfnGetCvarPointer("vildan_esp") && gEngfuncs.pfnGetCvarPointer("vildan_esp")->value > 0.5f) { GLboolean od = pglIsEnabled(GL_DEPTH_TEST); pglDisable(GL_DEPTH_TEST); R_DrawStudioModel(RI.currententity); if(od) pglEnable(GL_DEPTH_TEST); } else R_DrawStudioModel(RI.currententity);')
          patch_file("engine/ref/gl/gl_rmain.c", "gEngfuncs.GL_SwapBuffers();", "VILDAN_DrawMenu();\n\tgEngfuncs.GL_SwapBuffers();")

          # 4. Патч WSCRIPT (от GPT Sol 6)
          w_path = Path("engine/ref/gl/wscript")
          if w_path.exists():
              w = w_path.read_text()
              if "menu_source" not in w:
                  old_shlib = "bld.shlib(source = source,\n\t\t\ttarget = k,\n\t\t\tincludes = includes,\n\t\t\tfeatures = 'format',\n\t\t\tuse = libs + v['libs'],\n\t\t\tdefines = v['defines'] + ['REF_DLL=1'],\n\t\t\tinstall_path = bld.env.LIBDIR)"
                  new_shlib = """menu_source = source
          menu_includes = includes
          menu_defines = v['defines'] + ['REF_DLL=1']
          menu_lib = []
          menu_features = 'format'

          if bld.env.DEST_OS == 'android' and k in ('ref_gles3compat', 'ref_gl4es'):
              extra_files = [
                  'imgui/imgui.cpp',
                  'imgui/imgui_draw.cpp',
                  'imgui/imgui_tables.cpp',
                  'imgui/imgui_widgets.cpp',
                  'imgui/backends/imgui_impl_opengl3.cpp',
                  'vildan_menu.cpp',
              ]
              extra_nodes = []
              for filename in extra_files:
                  node = bld.path.find_node(filename)
                  if node is None:
                      bld.fatal('ref/gl: missing source file: ' + filename)
                  extra_nodes.append(node)

              menu_source = source + extra_nodes
              menu_includes = ['.', 'imgui', 'imgui/backends']
              menu_defines += ['IMGUI_IMPL_OPENGL_ES2']
              menu_lib = ['GLESv2']
              menu_features = 'cxx format'

          bld.shlib(source = menu_source,
              target = k,
              includes = menu_includes,
              features = menu_features,
              use = libs + v['libs'],
              defines = menu_defines,
              lib = menu_lib,
              install_path = bld.env.LIBDIR)"""
                  if old_shlib in w:
                      w = w.replace(old_shlib, new_shlib)
                      w_path.write_text(w)
                      print("Wscript patched successfully.")
                  else:
                      print("Warning: wscript structure changed, skip patch.")

          # 5. Патч IN_Move
          in_path = Path("client/cl_dll/input/input_xash3d.cpp")
          if in_path.exists():
              in_txt = in_path.read_text()
              helper = r'''#include <math.h>
          static void vildan_move_fix( usercmd_t *cmd ) {
              cl_entity_t *local = gEngfuncs.GetLocalPlayer();
              if (!local) return;
              cvar_t *bhop = gEngfuncs.pfnGetCvarPointer("vildan_bhop");
              cvar_t *aim = gEngfuncs.pfnGetCvarPointer("vildan_aimbot");
              if (bhop && bhop->value > 0.5f && (cmd->buttons & IN_JUMP)) {
                  if (local->curstate.onground != -1) cmd->buttons |= IN_JUMP;
                  else cmd->buttons &= ~IN_JUMP;
              }
              if (aim && aim->value > 0.5f && (cmd->buttons & IN_ATTACK)) {
                  cl_entity_t *bt = NULL; float bd = 2000.0f; vec3_t d;
                  for (int i = 1; i <= 32; i++) {
                      cl_entity_t *e = gEngfuncs.GetEntityByIndex(i);
                      if (!e || !e->player || e->curstate.health <= 0 || e->index == local->index) continue;
                      float dist = sqrt((e->origin[0]-local->origin[0])*(e->origin[0]-local->origin[0]) + (e->origin[1]-local->origin[1])*(e->origin[1]-local->origin[1]) + (e->origin[2]-local->origin[2])*(e->origin[2]-local->origin[2]));
                      if (dist < bd) { bd = dist; bt = e; }
                  }
                  if (bt) {
                      d[0] = bt->origin[0] - local->origin[0]; d[1] = bt->origin[1] - local->origin[1]; d[2] = bt->origin[2] - local->origin[2];
                      cmd->viewangles[0] = atan2f(d[2], sqrtf(d[0]*d[0] + d[1]*d[1])) * 180.0f / M_PI;
                      cmd->viewangles[1] = atan2f(d[1], d[0]) * 180.0f / M_PI;
                  }
              }
          }
          '''
              marker = "void IN_Move( float frametime, usercmd_t *cmd )\n{"
              if marker in in_txt and "vildan_move_fix" not in in_txt:
                  in_txt = in_txt.replace(marker, helper + "\n" + marker + "\n    vildan_move_fix(cmd);", 1)
                  in_path.write_text(in_txt)

          patch_file("client/cl_dll/cdll_int.cpp", 'static void LoadMenuInterface( void )\n{\n\tif( g_pMenu )\n\t\treturn;\n\n\tg_pMenu = GetNativeMenuExports();\n\tif( !g_pMenu )\n\t\tHUD_MessageBox( "Error: native object \\"MenuFactory\\" is unavailable\\n" );\n}', 'static void LoadMenuInterface( void )\n{\n\tg_pMenu = nullptr;\n}')

          # 6. ПАТЧ NINJA (чтобы видеть ошибки Waf)
          cfg_path = Path("engine/scripts/configure-ninja.py")
          if cfg_path.exists():
              cfg = cfg_path.read_text()
              old_cfg = "\tprocess.communicate()\n\n\twith io.open"
              new_cfg = "\tprocess.communicate()\n\tif process.returncode != 0:\n\t\traise SystemExit('Waf configure/ninja failed with exit code %d' % process.returncode)\n\tif not os.path.isfile(os.path.join(out_path, 'build.ninja')):\n\t\traise SystemExit('Waf finished without creating build.ninja')\n\n\twith io.open"
              if old_cfg in cfg:
                  cfg_path.write_text(cfg.replace(old_cfg, new_cfg, 1))
                  print("configure-ninja.py patched to expose errors.")

          PYEOF

      - name: Build
        run: |
          set -euo pipefail
          cd engine
          sed -i 's/ANDROID_NDK_VERSION=.*/ANDROID_NDK_VERSION="28.2.13676358"/' scripts/gha/deps_android.sh
          sed -i 's/ndkVersion = .*/ndkVersion = "28.2.13676358"/' android/app/build.gradle.kts
          sed -i 's/setOf("armeabi-v7a", "arm64-v8a", "x86")/setOf("arm64-v8a")/' android/app/build.gradle.kts
          
          GITHUB_WORKSPACE="$PWD" bash scripts/gha/deps_android.sh
          
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          GITHUB_WORKSPACE="$PWD" bash scripts/gha/build_android.sh
          
          cd ../client/android
          chmod +x gradlew
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon clean assembleGitDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Save
        if: always()
        run: |
          mkdir -p out/apk
          find engine -name "*.apk" | head -n 1 | xargs -I {} cp {} out/apk/VILDAN3D_Engine.apk || true
          find client -name "*.apk" | head -n 1 | xargs -I {} cp {} out/apk/VILDAN3D_Client.apk || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VILDAN3D
          path: out/apk/*.apk
