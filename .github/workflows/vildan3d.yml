name: VILDAN 3D Base
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  ENGINE_REPO: VILDANxTIGR/xash3d-fwgs
  CLIENT_REPO: VILDANxTIGR/cs16-client
  NDK_VERSION: 28.2.13676358
  SDL_VERSION: 2.32.10
  FFMPEG_VERSION: '9.0'
  GH_CPU_OS: android
  GH_CPU_ARCH: multiarch

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Engine
        uses: actions/checkout@v4
        with: { repository: '${{ env.ENGINE_REPO }}', path: engine }
      - name: Checkout Client
        uses: actions/checkout@v4
        with: { repository: '${{ env.CLIENT_REPO }}', path: client }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - name: Install deps
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail

          APT_OPTS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )

          for i in 1 2 3 4 5 6; do
            echo "APT attempt $i/6"

            if sudo apt-get "${APT_OPTS[@]}" update &&
               sudo apt-get "${APT_OPTS[@]}" install -y \
                 --no-install-recommends \
                 cmake ninja-build unzip; then
              echo "APT dependencies installed successfully"
              break
            fi

            if [ "$i" -eq 6 ]; then
              echo "::error::APT failed after 6 attempts"
              exit 1
            fi

            delay=$((i * 10))
            echo "APT failed; retrying in ${delay}s..."
            sleep "$delay"
          done

          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platform-tools" "platforms;android-35" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup ImGui
        run: |
          mkdir -p engine/3rdparty
          git clone --depth 1 https://github.com/ocornut/imgui.git engine/3rdparty/imgui

      - name: Patch Engine for ImGui
        shell: python {0}
        run: |
          import os

          header_cpp = "#pragma once\n#ifdef __cplusplus\nextern \"C\" {\n#endif\nvoid VILDAN_Init(void);\nvoid VILDAN_DrawMenu(void);\n#ifdef __cplusplus\n}\n#endif\n"
          with open("engine/ref/gl/vildan_menu.h", "w") as f:
              f.write(header_cpp)

          menu_cpp = (
              '#include "vildan_menu.h"\n'
              '#include "imgui.h"\n'
              '#include "imgui_impl_opengl3.h"\n'
              'extern "C" void VILDAN_Init(void)\n'
              '{\n'
              '    IMGUI_CHECKVERSION();\n'
              '    ImGui::CreateContext();\n'
              '    ImGui::StyleColorsDark();\n'
              '    ImGui_ImplOpenGL3_Init("#version 100");\n'
              '}\n'
              'extern "C" void VILDAN_DrawMenu(void)\n'
              '{\n'
              '    ImGui_ImplOpenGL3_NewFrame();\n'
              '    ImGui::NewFrame();\n'
              '    ImGui::Begin("VILDAN 3D");\n'
              '    ImGui::Text("Mod Menu Base is Working!");\n'
              '    ImGui::End();\n'
              '    ImGui::Render();\n'
              '    ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());\n'
              '}\n'
          )
          with open("engine/ref/gl/vildan_menu.cpp", "w") as f:
              f.write(menu_cpp)

          wscript_path = "engine/ref/gl/wscript"
          with open(wscript_path, "r") as f:
              w = f.read()
          
          source_marker = "source = bld.path.ant_glob(['*.c', 'gl2_shim/*.c'])"
          if w.count(source_marker) != 1:
              raise RuntimeError("Unexpected source declaration in wscript")
              
          w = w.replace(
              source_marker,
              "source = bld.path.ant_glob(['*.c', 'gl2_shim/*.c'])\n"
              "imgui_dir = bld.srcnode.find_dir('3rdparty/imgui')\n"
              "source += [imgui_dir.find_node('imgui.cpp'), imgui_dir.find_node('imgui_draw.cpp'), imgui_dir.find_node('imgui_tables.cpp'), imgui_dir.find_node('imgui_widgets.cpp'), imgui_dir.find_node('backends/imgui_impl_opengl3.cpp'), bld.path.find_node('vildan_menu.cpp')]\n"
              "includes = ['.', imgui_dir.abspath(), imgui_dir.find_dir('backends').abspath()]",
              1
          )
          
          if w.count("features = 'format'") != 1:
              raise RuntimeError("Unexpected Waf features declaration")
          w = w.replace("features = 'format'", "features = ['c', 'cxx', 'cxxshlib', 'format']", 1)
          
          with open(wscript_path, "w") as f:
              f.write(w)

          opengl_path = "engine/ref/gl/gl_opengl.c"
          with open(opengl_path, "r") as f:
              o = f.read()
          if '#include "vildan_menu.h"' not in o:
              o = '#include "vildan_menu.h"\n' + o
          
          marker = '// see R_ProcessEntData for tr.entities initialization'
          if marker not in o:
              raise RuntimeError("R_Init_Video marker not found in gl_opengl.c")
          o = o.replace(marker, 'VILDAN_Init();\n\n\t' + marker, 1)
          with open(opengl_path, "w") as f:
              f.write(o)

          main_path = "engine/ref/gl/gl_rmain.c"
          with open(main_path, "r") as f:
              m = f.read()
          if '#include "vildan_menu.h"' not in m:
              m = '#include "vildan_menu.h"\n' + m

          if 'gEngfuncs.GL_SwapBuffers();' not in m:
              raise RuntimeError("GL_SwapBuffers not found in gl_rmain.c")
          m = m.replace('gEngfuncs.GL_SwapBuffers();', 'VILDAN_DrawMenu();\n\tgEngfuncs.GL_SwapBuffers();')
          with open(main_path, "w") as f:
              f.write(m)

      - name: Init submodules
        run: |
          set -euo pipefail
          for d in engine client; do
            pushd "$d"
            if git ls-files --stage | grep -q '^160000'; then
              git submodule sync --recursive && git submodule update --init --recursive
            fi
            popd
          done

      - name: Prepare reliable downloads
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci-bin"
          printf '%s\n' \
          '#!/usr/bin/env bash' \
          'set -euo pipefail' \
          'REAL_WGET=/usr/bin/wget' \
          'STREAM=false' \
          'for arg in "$@"; do' \
          '  [ "$arg" = "-qO-" ] && STREAM=true' \
          'done' \
          'if [ "$STREAM" = false ]; then' \
          '  OUT_FILE=""' \
          '  prev=""' \
          '  for arg in "$@"; do' \
          '    if [ "$prev" = "-qO" ] || [ "$prev" = "-O" ]; then OUT_FILE="$arg"; fi' \
          '    prev="$arg"' \
          '  done' \
          '  "$REAL_WGET" --timeout=30 --tries=5 --waitretry=5 --retry-connrefused "$@" || exit 1' \
          '  if [ -n "$OUT_FILE" ] && [ -f "$OUT_FILE" ]; then' \
          '    URL="${@: -1}"' \
          '    case "$URL" in' \
          '      *.tar.gz) gzip -t "$OUT_FILE" || exit 1 ;;' \
          '      *.tar.xz) xz -t "$OUT_FILE" || exit 1 ;;' \
          '      *.zip) unzip -tq "$OUT_FILE" || exit 1 ;;' \
          '    esac' \
          '  fi' \
          '  exit 0' \
          'fi' \
          'URL="$1"' \
          'TMP="$(mktemp)"' \
          'trap "rm -f \$TMP" EXIT' \
          'for attempt in 1 2 3 4 5; do' \
          '  if "$REAL_WGET" -q --timeout=30 --tries=3 --waitretry=5 --retry-connrefused -O "$TMP" "$URL"; then' \
          '    valid=0' \
          '    case "$URL" in' \
          '      *.tar.gz) gzip -t "$TMP" || valid=1 ;;' \
          '      *.tar.xz) xz -t "$TMP" || valid=1 ;;' \
          '      *.zip) unzip -tq "$TMP" || valid=1 ;;' \
          '      *) test -s "$TMP" || valid=1 ;;' \
          '    esac' \
          '    if [ "$valid" -eq 0 ]; then' \
          '      cat "$TMP"' \
          '      exit 0' \
          '    fi' \
          '  fi' \
          '  echo "Download attempt $attempt/5 failed: $URL" >&2' \
          '  sleep "$attempt"' \
          'done' \
          'echo "Download failed after 5 attempts: $URL" >&2' \
          'exit 1' > "$GITHUB_WORKSPACE/.ci-bin/wget"
          chmod +x "$GITHUB_WORKSPACE/.ci-bin/wget"
          echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          export GH_CPU_OS=android
          export FFMPEG_VERSION=9.0
          
          cd engine
          
          sed -i 's/ANDROID_NDK_VERSION=.*/ANDROID_NDK_VERSION="28.2.13676358"/' scripts/gha/deps_android.sh
          grep -q 'ANDROID_NDK_VERSION="28.2.13676358"' scripts/gha/deps_android.sh
          
          sed -i 's/ndkVersion = .*/ndkVersion = "28.2.13676358"/' android/app/build.gradle.kts
          grep -q 'ndkVersion = "28.2.13676358"' android/app/build.gradle.kts
          
          sed -i 's/setOf("armeabi-v7a", "arm64-v8a", "x86")/setOf("arm64-v8a")/' android/app/build.gradle.kts
          
          GITHUB_WORKSPACE="$PWD" bash scripts/gha/deps_android.sh
          
          export ANDROID_HOME="$PWD/sdk"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          yes | "$ANDROID_HOME/cmdline-tools/tools/bin/sdkmanager" --install "ndk;28.2.13676358" || true
          
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          
          GITHUB_WORKSPACE="$PWD" bash scripts/gha/build_android.sh

      - name: Collect APKs
        run: |
          mkdir -p out/apk
          find engine -name "*.apk" -exec cp {} out/apk/ \;
          ls -lh out/apk

      - uses: actions/upload-artifact@v4
        with:
          name: VILDAN3D-Base-APK
          path: out/apk/*.apk
