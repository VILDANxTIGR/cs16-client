name: VILDAN 3D Final
on: [workflow_dispatch, push]
env:
  ENGINE_REPO: VILDANxTIGR/xash3d-fwgs
  CLIENT_REPO: VILDANxTIGR/cs16-client
  NDK_VERSION: 28.2.13676358
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { repository: '${{ env.ENGINE_REPO }}', ref: 707596f4905689ec224e993fcaa4d4ad66aa67d6, path: engine }
      - uses: actions/checkout@v4
        with: { repository: '${{ env.CLIENT_REPO }}', path: client }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build unzip curl
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV
      - name: Setup ImGui, SDL & FFmpeg
        run: |
          rm -rf engine/3rdparty/imgui engine/3rdparty/SDL engine/3rdparty/ffmpeg
          
          # 1. ImGui
          git clone --depth 1 --branch v1.90.5 https://github.com/ocornut/imgui.git engine/3rdparty/imgui
          
          # 2. SDL (через curl)
          mkdir -p engine/3rdparty/SDL
          curl -sL "https://codeload.github.com/libsdl-org/SDL/tar.gz/refs/tags/release-2.30.0" -o /tmp/SDL2.tar.gz
          tar -xzf /tmp/SDL2.tar.gz --strip-components=1 -C engine/3rdparty/SDL
          
          # 3. FFmpeg (через curl, версия n6.0)
          mkdir -p engine/3rdparty/ffmpeg
          curl -sL "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n6.0.tar.gz" -o /tmp/ffmpeg.tar.gz
          tar -xzf /tmp/ffmpeg.tar.gz --strip-components=1 -C engine/3rdparty/ffmpeg
      - name: Patch All
        shell: bash
        run: |
          python3 << 'PYEOF'
          from pathlib import Path
          def p(f, o, n):
              path = Path(f)
              if not path.exists(): return
              txt = path.read_text()
              if o in txt: path.write_text(txt.replace(o, n, 1))

          # 1. Патчим deps_android.sh
          p("engine/scripts/gha/deps_android.sh", 
            'echo "Download SDL"\npushd 3rdparty || exit 1\nwget "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL2-$SDL_VERSION.tar.gz" -qO- | tar -xzf - || exit 1\nmv "SDL2-$SDL_VERSION" SDL\npopd || exit 1', 
            'if [ ! -f 3rdparty/SDL/CMakeLists.txt ]; then\n    echo "Download SDL"\n    pushd 3rdparty || exit 1\n    wget "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL2-$SDL_VERSION.tar.gz" -qO- | tar -xzf - || exit 1\n    mv "SDL2-$SDL_VERSION" SDL\n    popd || exit 1\nelse\n    echo "SDL2 already exists, skipping download"\nfi')
          
          p("engine/scripts/gha/deps_android.sh", 
            'echo "Download FFMpeg"\npushd 3rdparty || exit 1\nwget "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n$FFMPEG_VERSION.tar.gz" -qO- | tar -xzf - || exit 1\nmv "FFmpeg-n$FFMPEG_VERSION" ffmpeg\npopd || exit 1', 
            'if [ ! -d 3rdparty/ffmpeg ]; then\n    echo "Download FFMpeg"\n    pushd 3rdparty || exit 1\n    wget "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n$FFMPEG_VERSION.tar.gz" -qO- | tar -xzf - || exit 1\n    mv "FFmpeg-n$FFMPEG_VERSION" ffmpeg\n    popd || exit 1\nelse\n    echo "FFmpeg already exists, skipping download"\nfi')

          # 2. Генерация ImGui меню
          Path("engine/ref/gl/vildan_menu.h").write_text('#pragma once\n#ifdef __cplusplus\nextern "C" {\n#endif\nvoid VILDAN_Init(void);\nvoid VILDAN_DrawMenu(void);\nvoid VILDAN_ProcessTouch(int, float, float, long long);\n#ifdef __cplusplus\n}\n#endif')
          
          cpp = r'''#include "vildan_menu.h"
          #include "imgui.h"
          #include "imgui_impl_opengl3.h"
          #include <GLES2/gl2.h>
          #include "ref_api.h"
          #include <SDL.h>
          static bool r = false, o = true;
          extern "C" void VILDAN_ProcessTouch(int a, float x, float y, long long f) {
              if(!r) return; auto& i = ImGui::GetIO();
              if(i.DisplaySize.x <= 0 || i.DisplaySize.y <= 0) return;
              float rx = x * i.DisplaySize.x, ry = y * i.DisplaySize.y;
              if(a == 1) { i.AddMouseSourceEvent(ImGuiMouseSource_TouchScreen); i.AddMousePosEvent(rx, ry); i.AddMouseButtonEvent(0, true); }
              else if(a == 2) { i.AddMousePosEvent(rx, ry); }
              else if(a == 3) { i.AddMousePosEvent(rx, ry); i.AddMouseButtonEvent(0, false); }
          }
          int VILDAN_EventWatch(void *u, SDL_Event *e) {
              if(e->type == SDL_FINGERDOWN || e->type == SDL_FINGERMOTION || e->type == SDL_FINGERUP) {
                  int a = e->type == SDL_FINGERDOWN ? 1 : (e->type == SDL_FINGERMOTION ? 2 : 3);
                  VILDAN_ProcessTouch(a, e->tfinger.x, e->tfinger.y, e->tfinger.fingerId);
              }
              return 0;
          }
          extern "C" void VILDAN_Init(void) {
              if(r) return; IMGUI_CHECKVERSION(); ImGui::CreateContext(); ImGui::StyleColorsDark();
              ImGui::GetIO().IniFilename = nullptr; ImGui::GetIO().Fonts->AddFontDefault();
              ImGui::GetStyle().ScaleAllSizes(1.7f);
              if(!ImGui_ImplOpenGL3_Init("#version 100")) return;
              SDL_AddEventWatch(VILDAN_EventWatch, NULL); r = true;
          }
          extern "C" void VILDAN_DrawMenu(void) {
              if(!r) return; GLint v[4]; glGetIntegerv(GL_VIEWPORT, v);
              if(v[2] <= 0 || v[3] <= 0) return; auto& i = ImGui::GetIO();
              i.DisplaySize = ImVec2(v[2], v[3]); i.DeltaTime = 1.0f/60.0f;
              ImGui_ImplOpenGL3_NewFrame(); ImGui::NewFrame();
              if(o) {
                  ImGui::SetNextWindowSize(ImVec2(800, 560), ImGuiCond_FirstUseEver);
                  ImGui::SetNextWindowPos(ImVec2(40, 40), ImGuiCond_FirstUseEver);
                  if(ImGui::Begin("VILDAN 3D - Mod Menu", &o)) {
                      ImGui::Text("Welcome!"); ImGui::Separator();
                      auto* c1 = gEngfuncs.pfnGetCvarPointer("vildan_esp"); bool b1 = c1 && c1->value > 0.5f;
                      if(ImGui::Checkbox("ESP", &b1)) { if(c1) c1->value = b1 ? 1.0f : 0.0f; }
                      auto* c2 = gEngfuncs.pfnGetCvarPointer("vildan_aimbot"); bool b2 = c2 && c2->value > 0.5f;
                      if(ImGui::Checkbox("Aimbot", &b2)) { if(c2) c2->value = b2 ? 1.0f : 0.0f; }
                      auto* c3 = gEngfuncs.pfnGetCvarPointer("vildan_bhop"); bool b3 = c3 && c3->value > 0.5f;
                      if(ImGui::Checkbox("Bhop", &b3)) { if(c3) c3->value = b3 ? 1.0f : 0.0f; }
                      if(ImGui::Button("Свернуть")) o = false;
                  } ImGui::End();
              }
              if(!o) {
                  ImGui::SetNextWindowPos(ImVec2(i.DisplaySize.x - 80, 10), ImGuiCond_Always);
                  ImGui::SetNextWindowSize(ImVec2(70, 70), ImGuiCond_Always);
                  if(ImGui::Begin("##V", nullptr, ImGuiWindowFlags_NoTitleBar | ImGuiWindowFlags_NoResize | ImGuiWindowFlags_NoMove | ImGuiWindowFlags_NoScrollbar)) {
                      if(ImGui::Button("V", ImVec2(60, 60))) o = true;
                  } ImGui::End();
              }
              ImGui::Render(); ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
          }'''
          Path("engine/ref/gl/vildan_menu.cpp").write_text(cpp)
          
          # 3. Патчи движка
          p("engine/ref/gl/gl_opengl.c", "#include \"../ref_api.h\"", "#include \"../ref_api.h\"\n#include \"vildan_menu.h\"")
          p("engine/ref/gl/gl_rmain.c", "#include \"../ref_api.h\"", "#include \"../ref_api.h\"\n#include \"vildan_menu.h\"")
          p("engine/ref/gl/gl_opengl.c", "GL_OnContextCreated();", "VILDAN_Init();")
          p("engine/ref/gl/gl_rmain.c", "R_DrawStudioModel( RI.currententity );", 'if(RI.currententity->player && gEngfuncs.pfnGetCvarPointer("vildan_esp") && gEngfuncs.pfnGetCvarPointer("vildan_esp")->value > 0.5f) { GLboolean od = pglIsEnabled(GL_DEPTH_TEST); pglDisable(GL_DEPTH_TEST); R_DrawStudioModel(RI.currententity); if(od) pglEnable(GL_DEPTH_TEST); } else R_DrawStudioModel(RI.currententity);')
          p("engine/ref/gl/gl_rmain.c", "gEngfuncs.GL_SwapBuffers();", "VILDAN_DrawMenu();\ngEngfuncs.GL_SwapBuffers();")
          
          # 4. Патч wscript (добавляем SDL)
          p("engine/ref/gl/wscript", "source = bld.path.ant_glob(['*.c', 'gl2_shim/*.c'])", "source = bld.path.ant_glob(['*.c', 'gl2_shim/*.c'])\n\ti = bld.srcnode.find_dir('3rdparty/imgui')\n\ts = bld.srcnode.find_dir('3rdparty/SDL/include')\n\tsource += [bld.path.find_node('vildan_menu.cpp'), i.find_node('imgui.cpp'), i.find_node('imgui_draw.cpp'), i.find_node('imgui_tables.cpp'), i.find_node('imgui_widgets.cpp'), i.find_node('backends/imgui_impl_opengl3.cpp')]\n\tincludes = [i.abspath(), i.find_dir('backends').abspath(), s.abspath()]")
          p("engine/ref/gl/wscript", "bld.shlib(source = source,", "bld(features = 'cxxshlib', lib = ['GLESv2'], source = source,")

          # 5. Патч клиента (Аим/Бхоп)
          n = '''void IN_Move( float frametime, usercmd_t *cmd )\n{\n    cl_entity_t *local = gEngfuncs.GetLocalPlayer();\n    if (local && gEngfuncs.pfnGetCvarPointer("vildan_bhop") && gEngfuncs.pfnGetCvarPointer("vildan_bhop")->value > 0.5f && (cmd->buttons & IN_JUMP)) {\n        if (local->curstate.onground != -1) cmd->buttons |= IN_JUMP;\n        else cmd->buttons &= ~IN_JUMP;\n    }\n    if (gEngfuncs.pfnGetCvarPointer("vildan_aimbot") && gEngfuncs.pfnGetCvarPointer("vildan_aimbot")->value > 0.5f && local && (cmd->buttons & IN_ATTACK)) {\n        cl_entity_t *bt = NULL; float bd = 99999.0f; vec3_t d;\n        for (int i = 1; i <= 32; i++) {\n            cl_entity_t *e = gEngfuncs.GetEntityByIndex(i);\n            if (e && e->player && e->curstate.health > 0 && e->index != local->index) {\n                d[0] = e->origin[0] - local->origin[0]; d[1] = e->origin[1] - local->origin[1]; d[2] = e->origin[2] - local->origin[2];\n                float dist = sqrt(d[0]*d[0] + d[1]*d[1] + d[2]*d[2]);\n                if (dist < bd && dist < 2000.0f) { bd = dist; bt = e; }\n            }\n        }\n        if (bt) {\n            d[0] = bt->origin[0] - local->origin[0]; d[1] = bt->origin[1] - local->origin[1]; d[2] = bt->origin[2] - local->origin[2];\n            float hyp = sqrt(d[0]*d[0] + d[1]*d[1]);\n            cmd->viewangles[0] = atan2(d[2], hyp) * 180.0f / M_PI;\n            cmd->viewangles[1] = atan2(d[1], d[0]) * 180.0f / M_PI;\n        }\n    }'''
          p("client/cl_dll/input/input_xash3d.cpp", "void IN_Move( float frametime, usercmd_t *cmd )\n{", n)
          p("client/cl_dll/cdll_int.cpp", 'static void LoadMenuInterface( void )\n{\n\tif( g_pMenu )\n\t\treturn;\n\n\tg_pMenu = GetNativeMenuExports();\n\tif( !g_pMenu )\n\t\tHUD_MessageBox( "Error: native object \\"MenuFactory\\" is unavailable\\n" );\n}', 'static void LoadMenuInterface( void )\n{\n\tg_pMenu = nullptr;\n}')
          PYEOF
      - name: Build
        run: |
          cd engine
          sed -i 's/ANDROID_NDK_VERSION=.*/ANDROID_NDK_VERSION="28.2.13676358"/' scripts/gha/deps_android.sh
          sed -i 's/ndkVersion = .*/ndkVersion = "28.2.13676358"/' android/app/build.gradle.kts
          sed -i 's/setOf("armeabi-v7a", "arm64-v8a", "x86")/setOf("arm64-v8a")/' android/app/build.gradle.kts
          GITHUB_WORKSPACE="$PWD" bash scripts/gha/deps_android.sh
          export ANDROID_HOME="$PWD/sdk"; export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          GITHUB_WORKSPACE="$PWD" bash scripts/gha/build_android.sh
          cd ../client/android
          chmod +x gradlew
          ./gradlew clean assembleGitDebug -Pandroid.injected.build.abi=arm64-v8a
      - name: Save
        if: always()
        run: |
          mkdir -p out/apk
          find engine -name "*.apk" | head -n 1 | xargs -I {} cp {} out/apk/VILDAN3D_Engine.apk || true
          find client -name "*.apk" | head -n 1 | xargs -I {} cp {} out/apk/VILDAN3D_Client.apk || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VILDAN3D
          path: out/apk/*.apk
